name: Newman API Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - day6-newman-github-actions
    paths:
      - "postman/**"
      - "automation/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/newman-api-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "postman/**"
      - "automation/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/newman-api-tests.yml"

permissions:
  contents: read

concurrency:
  group: restful-booker-api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman-api-tests:
    name: Run Restful Booker API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Display Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install project dependencies
        run: npm ci

      - name: Display Newman version
        run: npx newman --version

      - name: Validate required repository secrets
        env:
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          if [ -z "$BOOKER_USERNAME" ]; then
            echo "::error::BOOKER_USERNAME repository secret is missing."
            exit 1
          fi

          if [ -z "$BOOKER_PASSWORD" ]; then
            echo "::error::BOOKER_PASSWORD repository secret is missing."
            exit 1
          fi

          echo "Required repository secrets are configured."

      - name: Create Newman results directory
        run: mkdir -p newman-results

      # ------------------------------------------------------
      # STRICT CI QUALITY GATE
      #
      # This stable smoke suite must pass.
      # Any failed assertion makes the workflow fail.
      # ------------------------------------------------------
      - name: Run CI smoke collection
        id: smoke
        env:
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          npx newman run \
            "postman/restful-booker-ci-smoke.public-sanitized.postman_collection.json" \
            -e "postman/restful-booker-template.public-sanitized.postman_environment.json" \
            --env-var "username=$BOOKER_USERNAME" \
            --env-var "password=$BOOKER_PASSWORD" \
            --delay-request 100 \
            --timeout-request 15000 \
            -r cli,json,junit \
            --reporter-json-export "newman-results/smoke-results.json" \
            --reporter-junit-export "newman-results/smoke-results.xml" \
            --color off

      # ------------------------------------------------------
      # COMPLETE VALIDATION SUITE
      #
      # The full suite retains negative tests and confirmed
      # requirement mismatches. Its failures remain visible
      # but do not override a successful smoke quality gate.
      # ------------------------------------------------------
      - name: Run full validation suite
        id: full_validation
        continue-on-error: true
        env:
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          npx newman run \
            "postman/restful-booker-api-portfolio.public-sanitized.postman_collection.json" \
            -e "postman/restful-booker-template.public-sanitized.postman_environment.json" \
            --env-var "username=$BOOKER_USERNAME" \
            --env-var "password=$BOOKER_PASSWORD" \
            --delay-request 100 \
            --timeout-request 15000 \
            -r cli,json,junit \
            --reporter-json-export "newman-results/full-validation-results.json" \
            --reporter-junit-export "newman-results/full-validation-results.xml" \
            --color off

      - name: Report full validation status
        if: always()
        run: |
          if [ "${{ steps.full_validation.outcome }}" = "failure" ]; then
            echo "::warning::The full validation suite detected documented Restful Booker API requirement mismatches."
            echo "::warning::Review the full-validation-newman-results artifact for details."
          elif [ "${{ steps.full_validation.outcome }}" = "success" ]; then
            echo "The full validation suite completed without failed assertions."
          else
            echo "::notice::The full validation suite did not run."
          fi

      - name: Write Newman workflow summary
        if: always()
        run: |
          {
            echo "## Newman API Test Results"
            echo ""
            echo "| Test suite | Outcome | CI behavior |"
            echo "|---|---|---|"
            echo "| CI smoke suite | ${{ steps.smoke.outcome }} | Strict quality gate |"
            echo "| Full validation suite | ${{ steps.full_validation.outcome }} | Known-defect reporting |"
            echo ""
            echo "### Testing Strategy"
            echo ""
            echo "The CI smoke suite determines the final workflow result."
            echo ""
            echo "The complete validation suite preserves negative tests and documented API requirement mismatches. Its results remain visible without overriding a successful smoke quality gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-newman-results
          path: |
            newman-results/smoke-results.json
            newman-results/smoke-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full-validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-validation-newman-results
          path: |
            newman-results/full-validation-results.json
            newman-results/full-validation-results.xml
          if-no-files-found: warn
          retention-days: 14